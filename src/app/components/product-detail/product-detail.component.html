<div class="detail-backdrop" (click)="onBackdropClick()">
  <div class="detail-dialog" (click)="onDialogClick($event)">
    <!-- Close button -->
    <button class="close-btn" (click)="onBackdropClick()" aria-label="Dong">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
      </svg>
    </button>

    <!-- Product Image -->
    <div class="detail-image-wrap">
      <img
        [src]="currentImage"
        [alt]="selectedProduct.FullName"
        class="detail-image"
      />
      <span class="stock-badge" *ngIf="isOutOfStock">Hết hàng</span>


      <!-- Navigation arrows (only when multiple images) -->
      <ng-container *ngIf="productImages.length > 1">
        <button class="img-nav img-nav-prev" (click)="$event.stopPropagation(); prevImage()" aria-label="Ảnh trước">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <button class="img-nav img-nav-next" (click)="$event.stopPropagation(); nextImage()" aria-label="Ảnh sau">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 6 15 12 9 18"/></svg>
        </button>
        <div class="img-counter">{{ currentImageIndex + 1 }}/{{ productImages.length }}</div>
      </ng-container>
    </div>

    <!-- Thumbnail strip -->
    <div class="img-thumbnails" *ngIf="productImages.length > 1">
      <img *ngFor="let img of productImages; let i = index"
           [src]="img"
           [class.thumb-active]="i === currentImageIndex"
           (click)="selectImage(i)"
           class="img-thumb"
           loading="lazy" />
    </div>

    <!-- Product Info -->
    <div class="detail-body">
      <h2 class="detail-name">{{ selectedProduct.FullName }}</h2>

      <!-- Unit Selector (horizontal) -->
      <div class="unit-selector" *ngIf="group.length > 1">
        <button
          *ngFor="let item of group"
          class="unit-pill"
          [class.unit-active]="item.Id === selectedProduct.Id"
          (click)="selectUnit(item)"
        >
          {{ item.Unit }}
        </button>
      </div>
      <div class="unit-single" *ngIf="group.length <= 1 && selectedProduct.Unit">
        {{ selectedProduct.Unit }}
      </div>

      <!-- Pricing -->
      <div class="pricing">
        <div class="price-row price-market" *ngIf="!isSale">
          <span class="price-label">Giá thị trường:</span>
          <span class="price-value strikethrough">{{ formatPrice(marketPrice) }} đ</span>
        </div>
        <div class="price-row price-market" *ngIf="isSale">
          <span class="price-label">Giá gốc:</span>
          <span class="price-value strikethrough">{{ formatPrice(originalPrice) }} đ</span>
        </div>
        <div class="price-row price-sale">
          <span class="price-label">Giá bán:</span>
          <span class="price-value">{{ formatPrice(salePrice) }} đ</span>
        </div>
      </div>

      <!-- Stock Status -->
      <div class="stock-status" [ngClass]="'stock-' + stockStatus">
        <span class="stock-dot"></span>
        <span class="stock-text">{{ stockLabel }}</span>
      </div>

      <!-- Add to Cart -->
      <button
        class="detail-add-btn"
        [class.added]="addedAnimation"
        [disabled]="isOutOfStock"
        (click)="addToCart()"
      >
        {{ addedAnimation ? 'Đã thêm vào giỏ hàng!' : 'Thêm vào giỏ hàng' }}
      </button>
    </div>
  </div>
</div>
