<div class="product-card" [class.out-of-stock]="isOutOfStock" (click)="onCardClick()">
  <div class="card-image-wrap">
    <img
      [src]="product.Image || 'assets/no-image.svg'"
      [alt]="product.FullName"
      class="card-image"
      loading="lazy"
    />
    <span class="stock-badge" *ngIf="isOutOfStock">Hết hàng</span>

    <button
      class="info-btn"
      *ngIf="hasDescription"
      (click)="toggleDescription($event)"
      aria-label="Xem mô tả"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
        <circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="11"/><line x1="12" y1="8" x2="12.01" y2="8"/>
      </svg>
    </button>

    <div class="desc-overlay" *ngIf="showDescription" (click)="toggleDescription($event)">
      <div class="desc-title">Mô tả</div>
      <div class="desc-text">{{ product.Description }}</div>
    </div>
  </div>

  <div class="card-body">
    <h3 class="card-name">{{ product.FullName }}</h3>
    <div class="card-unit" *ngIf="product.Unit">{{ product.Unit }}</div>
    <div class="card-price">{{ formatPrice(product.BasePrice) }} đ</div>
  </div>

  <button
    class="add-btn"
    [class.added]="addedAnimation"
    [disabled]="isOutOfStock"
    (click)="addToCart($event)"
    aria-label="Thêm vào giỏ"
  >
    <svg *ngIf="!addedAnimation" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    <svg *ngIf="addedAnimation" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
    <span>{{ addedAnimation ? 'Đã Thêm' : 'Thêm' }}</span>
  </button>
</div>
